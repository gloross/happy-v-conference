<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy V — ACOG 2026</title>
  <meta name="description" content="Happy V at ACOG 2026 — explore our clinically-formulated women's health line." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23dc6b88' stroke-width='6'/%3E%3Cpath d='M30 35 L50 70 L70 35' fill='none' stroke='%23dc6b88' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Fonts: Hanken Grotesk via Google, Perfectly Nineties via @font-face in site.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN (no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Perfectly Nineties"', 'Georgia', 'serif'],
            sans: ['"Hanken Grotesk"', 'system-ui', 'sans-serif'],
          },
          colors: {
            navy: {
              DEFAULT: '#25425D',
              brand:   '#25425D',
              50:      '#F9FBFD',
              200:     '#E9ECEF',
              550:     '#8A95A1',
            },
            pink: {
              DEFAULT: '#EC8AAE',
              brand:   '#EC8AAE',
              200:     '#F4B6D2',
              300:     '#EC8AAE',
            },
            sky: {
              200: '#A7CDED',
              300: '#6CB4DA',
            },
            cream: '#FBF8F7',
            sand:  '#F6F1F1',
            ink:   '#25425D',
          },
          boxShadow: {
            card: '0 1px 2px rgba(0,0,0,0.06)',
            soft: '0 0 0 1px rgba(37,66,93,0.06)',
          },
          borderRadius: {
            big: '16px',
            xl2: '1.25rem',
          }
        },
      },
    };
  </script>

  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body class="font-sans bg-white text-navy antialiased min-h-screen flex flex-col">

  <!-- Top bar (hidden on home — home has its own hero header) -->
  <header id="topbar" class="topbar w-full border-b border-navy-200 bg-white sticky top-0 z-30">
    <div class="max-w-[1366px] mx-auto px-12 h-[68px] grid grid-cols-3 items-center">
      <button id="backBtn" class="text-navy text-[20px] font-semibold flex items-center gap-3 invisible justify-self-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <a href="#/home" class="logo-link justify-self-center" aria-label="Happy V home">
        <span class="logo logo--navy" aria-hidden="true">
          <span class="logo__part logo__v-circle"   ><img src="assets/img/logo/v-mark-circle.svg"          alt=""/></span>
          <span class="logo__part logo__r-small"    ><img src="assets/img/logo/registered-mark-small.svg"  alt=""/></span>
          <span class="logo__part logo__h"          ><img src="assets/img/logo/letter-h-navy.svg"          alt=""/></span>
          <span class="logo__part logo__a"          ><img src="assets/img/logo/letter-a-navy.svg"          alt=""/></span>
          <span class="logo__part logo__p1"         ><img src="assets/img/logo/letter-p1-navy.svg"         alt=""/></span>
          <span class="logo__part logo__p2"         ><img src="assets/img/logo/letter-p2-navy.svg"         alt=""/></span>
          <span class="logo__part logo__y"          ><img src="assets/img/logo/letter-y-navy.svg"          alt=""/></span>
          <span class="logo__part logo__v"          ><img src="assets/img/logo/letter-v-navy.svg"          alt=""/></span>
          <span class="logo__part logo__r-large"    ><img src="assets/img/logo/registered-mark-large-navy.svg" alt=""/></span>
        </span>
      </a>
      <div id="progress" class="progress-dots flex items-center gap-2 justify-self-end"></div>
    </div>
  </header>

  <!-- App view -->
  <main id="app" class="flex-1 w-full"></main>

  <!-- Bottom nav (hidden until quiz done) -->
  <nav id="bottomnav" class="hidden fixed bottom-0 inset-x-0 bg-white border-t border-navy-200 z-20">
    <div class="max-w-[1366px] mx-auto px-3 py-3 grid grid-cols-5 gap-2">
      <a href="#/home"           data-route="home"           class="navlink"><span class="navicon" aria-hidden="true"></span><span class="navlabel">Home</span></a>
      <a href="#/recommendation" data-route="recommendation" class="navlink"><span class="navicon" aria-hidden="true"></span><span class="navlabel">Products</span></a>
      <a href="#/comparison"     data-route="comparison"     class="navlink"><span class="navicon" aria-hidden="true"></span><span class="navlabel">Compare</span></a>
      <a href="#/coming-soon"    data-route="coming-soon"    class="navlink"><span class="navicon" aria-hidden="true"></span><span class="navlabel">Coming Soon</span></a>
      <a href="#/sample-form"    data-route="sample-form"    class="navlink"><span class="navicon" aria-hidden="true"></span><span class="navlabel">Get Samples</span></a>
    </div>
  </nav>

  <!-- App scripts -->
  <!-- Bump v=… whenever you edit a JS file to bust the browser cache. -->
  <script src="assets/js/quiz-data.js?v=9"></script>
  <script src="assets/js/state.js?v=9"></script>
  <script src="assets/js/submit.js?v=9"></script>
  <script src="assets/js/views.js?v=9"></script>
  <script src="assets/js/app.js?v=9"></script>
</body>
</html>
